name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the older run. Every other run has a
# group of its own, so each commit on main gets a verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Pinned images, so a moved -latest label does not change the system
      # under test without a commit. apt gives each Ubuntu release its own
      # SBCL. Homebrew gives the SBCL in the macOS image snapshot, which an
      # image update can change. The SBCL version step logs what each job got.
      matrix:
        os: [ubuntu-24.04, macos-26]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SBCL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - name: SBCL version
        run: sbcl --version

      - name: Build, test, lint, links
        run: make check

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f "$archive" actionlint

      - name: Lint workflows
        run: actionlint -color

      - name: Assert every action is pinned to a commit SHA
        run: |
          unpinned="$(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*[^./#[:space:]]' .github/workflows \
            | grep -vE 'uses:[[:space:]]*[^@]+@[0-9a-f]{40}[[:space:]]+# ' || true)"
          if [ -n "$unpinned" ]; then
            echo 'actions must be pinned to a commit SHA with a version comment:' >&2
            printf '%s\n' "$unpinned" >&2
            exit 1
          fi
          echo 'ok: every action is pinned to a commit SHA'
