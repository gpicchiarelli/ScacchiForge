<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="t" aria-describedby="d">
  <title id="t">A pruned search tree</title>
  <desc id="d">The tree that alpha-beta searches when the best move is always tried first: two moves per position, five plies deep, and at every position the first move tried is drawn on the right. The principal variation runs in amber from the root to the bottom right: the best line so far. The other moves searched are strong lines. At each of the eight cutoffs the line breaks, and the faint subtree beyond the break is pruned: never searched, and provably never needed. Thirty-four of the sixty-two moves and twenty-one of the thirty-two leaves are pruned; the eleven leaves searched are the fewest that can prove the value (Knuth and Moore, 1975).</desc>
  <style>@media (max-width:800px){.n{font-size:19px;letter-spacing:2.85px}.e{font-size:22px}}@media (max-width:560px){.f{stroke-width:7.2px;transform:translateY(8.65px)}.i{stroke-width:7.2px;transform:translateY(8.65px)}.p{stroke-width:9.6px;transform:translateY(8.2px)}.e{display:none}.n{font-size:32px;letter-spacing:4.8px;transform:translate(-2.52px,20.56px)}.r{transform:translate(2.88px,20.56px)}}</style>
